<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/">
      <span class="brand-icon"><svg class="logo" aria-hidden="true"><use href="#logo"/></svg></span>
      <span>
        <span class="brand-name" id="driveLabel">Drive</span>
        <span class="brand-sub" id="driveRoot"></span>
      </span>
    </a>
    <div class="usage">
      <div class="usage-bar"><span id="usageFill"></span></div>
      <div class="usage-text" id="usageText">&nbsp;</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="index-state" id="indexState"></div>
      <div class="side-actions">
        <button class="ghost-btn" id="rescanBtn" title="Rescan the drive"><svg><use href="#i-refresh"/></svg><span>Rescan</span></button>
        <button class="ghost-btn" id="themeBtn" title="Toggle light / dark"><svg><use href="#i-moon"/></svg><span>Theme</span></button>
        <button class="ghost-btn danger" id="stopBtn" title="Stop the dashboard server (do this before ejecting)"><svg><use href="#i-power"/></svg><span>Stop</span></button>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-narrow" id="menuBtn" aria-label="Menu"><svg><use href="#i-menu"/></svg></button>
      <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
      <label class="search">
        <svg><use href="#i-search"/></svg>
        <input id="search" type="search" placeholder="Search the drive" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </label>
      <div class="seg" role="group" aria-label="View">
        <button id="gridBtn" aria-label="Grid view"><svg><use href="#i-grid"/></svg></button>
        <button id="listBtn" aria-label="List view"><svg><use href="#i-list"/></svg></button>
      </div>
    </header>
    <section class="view" id="view"></section>
    <section class="np" id="notepad" hidden aria-label="Notepad"></section>
    <div class="drop-overlay" id="dropOverlay" hidden><div class="drop-card"><svg><use href="#i-upload"/></svg><span class="drop-text">Drop to upload</span></div></div>
    <div class="sel-bar" id="selBar" hidden role="toolbar" aria-label="Selection"></div>
    <div class="upload-panel" id="uploadPanel" hidden role="status" aria-live="polite"></div>
  </main>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <header class="modal-head">
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-actions" id="modalActions"></div>
      <button class="icon-btn" id="modalClose" aria-label="Close"><svg><use href="#i-x"/></svg></button>
    </header>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
